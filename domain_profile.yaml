domain: multi_agent_coordination
display_name: Casino Royale (1967) — FIVE 00s Mission Software
required_packages:
  - numpy
  - matplotlib
  - bond-api
  - pytest
preferred_outputs:
  - pdf
  - html
  - slides
validation_gates:
  - determinism
  - protocol_conformance
  - coverage_90
  - zero_mocks
figure_types:
  - coordination_farce
  - dispatch_chaos
  - spoof_analyzer
citation_policy: official_or_scholarly
source_policy: "Sourced numeric claims trace to src/casino_royale_1967 or manuscript/config.yaml; no published external DOI (local-only tree)."
review_gates:
  - determinism
  - protocol_conformance
  - coverage_90
artifact_expectations:
  - output/data/manuscript_variables.json
  - output/manuscript/00_abstract.md
  - output/figures/coordination_farce.png
  - output/figures/dispatch_chaos.png
  - output/figures/spoof_analyzer.png
benchmark_rubric:
  name: bond-film-readiness
  dimensions:
    - name: protocol_conformance
      weight: 2.0
    - name: determinism
      weight: 2.0
    - name: coverage_90
      weight: 1.0
    - name: zero_mocks
      weight: 1.0
    - name: render_success
      weight: 1.0
llm_prompt_guidance: "Use generated mission artifacts and manuscript variables as the evidence source; do not invent numeric results."
