# Casino Royale (1967) — FIVE 00s mission software configuration
# PROJECT BOND film package. This file is the single source of truth for
# manuscript identity and experiment parameters. It is loaded by
# src/casino_royale_1967/manuscript_variables.py (load_mission_config) and
# consumed at render time; metrics are never hand-authored in prose.

paper:
  title: "Casino Royale: FIVE 00s — Special-Agent Mission Software"
  subtitle: "Deterministic Modelling of Multi-Agent Coordination Failure, Dispatch Chaos, Spoof Ops Doctrine, Identity Confusion, Baccarat Odds, and Doctrine Escalation"
  version: "0.1.0"
  # The manuscript's dated stamp ({{MANUSCRIPT_DATE}}) and its declared
  # interpreter range ({{PYTHON_REQUIRES}}, kept equal to requires-python in
  # pyproject.toml by tests/test_regeneration_determinism.py). Both are
  # committed here precisely so no artifact reads a clock or the running
  # interpreter — that is what makes regeneration byte-for-byte.
  date: "2026-08-04"
  python_requires: ">=3.11"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  # Local-only PROJECT BOND tree: no remote, no published DOI. These fields
  # document the fork contract; they are deliberately absent from sidecars.
  repository_url: "local (projects/working/bond/casino_royale_1967)"
  transmission_bookends:
    enabled: false
    show_steganography: false
  deposit_filename:
    enabled: false

# Mission identity — injected into manuscript as tokens.
mission:
  identity: "Casino Royale (1967)"
  codename: "FIVE 00s"

# Experiment parameters — read by manuscript_variables.py and reused by the
# deterministic domain analyses.
experiment:
  overlap_weight: 2.0
  conflict_weight: 3.0
  max_ticks: 100

keywords:
  - "multi-agent coordination"
  - "coordination failure"
  - "agent dispatch simulation"
  - "protocol violations"
  - "satirical ops doctrine"
  - "identity confusion"
  - "mutual information"
  - "Bayesian identity resolution"
  - "baccarat odds"
  - "birthday problem"
  - "absorbing Markov chains"
  - "deterministic modelling"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

render:
  formats:
    pdf: true
    html: true
    slides: true
